const t=(k)=>T[S.lang][k]||T.en[k]||k,esc=(x)=>String(x??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const inr=(n)=>"₹"+Math.round(n).toLocaleString("en-IN"),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let EV=[];
const apply=(c,e)=>e.type==="OPEN"||e.type==="COUNT"?e.q:e.type==="SALE"?c-e.q:e.type==="RECEIPT"?c+e.q:c;
function migrate(){S.events=S.events||[];const sold={},first={};for(const x of S.sales||[]){S.events.push({id:uid(),t:x.t,type:"SALE",pid:x.pid,q:x.q});sold[x.pid]=(sold[x.pid]||0)+x.q;first[x.pid]=Math.min(first[x.pid]||x.t,x.t)}for(const p of S.products)if(Object.prototype.hasOwnProperty.call(p,"stock")&&typeof p.stock==="number"){S.events.push({id:uid(),t:(first[p.id]||Date.now())-1,type:"OPEN",pid:p.id,q:p.stock+(sold[p.id]||0),src:"MIGRATED"});delete p.stock}delete S.sales;save()}
function derive(){const v=new Set(S.events.filter((e)=>e.type==="VOID").map((e)=>e.ref));EV=S.events.filter((e)=>e.type!=="VOID"&&!v.has(e.id)).sort((a,b)=>a.t-b.t);const st={};for(const e of EV)st[e.pid]=apply(st[e.pid]||0,e);for(const p of S.products){const r=st[p.id]||0;Object.defineProperty(p,"stock",{value:Math.max(0,r),writable:true,enumerable:false,configurable:true});Object.defineProperty(p,"raw",{value:r,writable:true,enumerable:false,configurable:true})}}

function demand(pid){const evs=EV.filter((e)=>e.pid===pid&&e.type!=="BILL"),N=28,d0=new Date().setHours(0,0,0,0),ws=d0-N*DAY;if(!evs.length)return{r:0,conf:"low2",cens:0,m:"—"};
  let cur=0,i=0;for(;i<evs.length&&evs[i].t<ws;i++)cur=apply(cur,evs[i]);const first=evs[0].t,days=[];
  for(let k=0;k<N;k++){const a=ws+k*DAY,b=a+DAY;let min=a<first?Infinity:cur,sold=0,lost=0;for(;i<evs.length&&evs[i].t<b;i++){const x=evs[i];cur=apply(cur,x);min=Math.min(min,cur);if(x.type==="SALE")sold+=x.q;if(x.type==="LOST")lost+=x.q}if(min===Infinity)min=cur;if(b>first)days.push({sold,lost,cens:min<=0})}
  const ys=days.filter((d)=>!d.cens||d.lost>0).map((d)=>d.sold+d.lost),cens=days.filter((d)=>d.cens).length,n=ys.length,mean=(a)=>a.reduce((x,y)=>x+y,0)/a.length;
  if(n<8)return{r:n?mean(ys):evs.filter((e)=>e.t>=d0&&(e.type==="SALE"||e.type==="LOST")).reduce((a,e)=>a+e.q,0),conf:n>=3?"medium":"low2",cens,m:"avg"};
  const ses=(h,a)=>h.reduce((l,y)=>a*y+(1-a)*l,h[0]),C={naive:(h)=>h[h.length-1],ma3:(h)=>mean(h.slice(-3)),ma7:(h)=>mean(h.slice(-7)),ses2:(h)=>ses(h,.2),ses5:(h)=>ses(h,.5),ses8:(h)=>ses(h,.8)};let best=null;
  for(const[k,f]of Object.entries(C)){let ae=0,sa=0;for(let j=4;j<n;j++){ae+=Math.abs(f(ys.slice(0,j))-ys[j]);sa+=ys[j]}const w=sa>0?ae/sa:Infinity;if(!best||w<best.w)best={k,w,r:Math.max(0,f(ys))}}
  return{r:best.r,m:best.k,w:best.w,conf:n>=14&&best.w<.6?"high":"medium",cens}}
function evState(p){if(p.raw<0)return"stale";let tm=0;for(const e of EV)if(e.pid===p.id&&(e.type==="COUNT"||e.type==="OPEN"))tm=e.t;const a=(Date.now()-tm)/DAY;return a<=7?"verified":a<=14?"aging":"stale"}
function plan(p){const d=demand(p.id),r=d.r,lead=+p.lead||2,pack=+p.pack||1,trig=Math.max(+p.min||0,r*(lead+3)),need=p.stock<=trig,target=Math.max(r*(lead+7),(+p.min||0)*2);return{r,need,hist:r>0,conf:d.conf,m:d.m,cens:d.cens,state:evState(p),cover:r>0?p.stock/r:null,qty:need?Math.max(pack,Math.ceil((target-p.stock)/pack)*pack):0}}

const IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',sell:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/>',stock:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',order:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',udhaar:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>'};

const emptyState=()=>`<div class="empty"><p class="mut">${t("noitems")}</p><button class="btn p" id="add0">${t("add")}</button> <button class="btn" id="smp">${t("sample")}</button></div>`;

function vHome(){
  const v=$("#view");if(!S.products.length){v.innerHTML=`<h2>${t("today")}</h2>`+emptyState();wireEmpty();return}
  const d0=new Date().setHours(0,0,0,0),ts=EV.filter((x)=>x.type==="SALE"&&x.t>=d0);let rev=0,pf=0;for(const x of ts){const p=prod(x.pid);if(p){const pr=x.price??p.price;rev+=x.q*pr;pf+=x.q*(pr-p.cost)}}

  dlg(`<form id="pf"><h2>${n?t("add"):t("edit")}</h2>${f("name","name")}<div class="row2"><div>${f("price","price","number")}</div><div>${f("cost","cost","number")}</div><div>${f("stock","qty","number")}</div><div>${f("unit","unit")}</div><div>${f("min","minq","number")}</div><div>${f("lead","lead","number")}</div></div><div class="row2"><div>${f("pack","pack","number")}</div><div>${f("gst","gstp","number")}</div></div>${f("supplier","sup")}${f("phone","phone","tel")}<div class="acts">${n?"":`<button type="button" class="btn" style="margin-right:auto;color:var(--r)" data-del>${t("del")}</button>`}<button type="button" class="btn" data-x>${t("cancel")}</button><button class="btn p">${t("save")}</button></div></form>`,(d)=>{
    d.querySelector("[data-del]")?.addEventListener("click",()=>{if(confirm(t("del")+"?")){S.products=S.products.filter((x)=>x.id!==p.id);save();d.close();render()}});
    d.querySelector("#pf").onsubmit=(e)=>{e.preventDefault();const g=Object.fromEntries(new FormData(e.target)),nm=g.name.trim();if(!nm)return;const sq=Math.max(0,+g.stock||0),o={name:nm,unit:g.unit.trim()||"pc",price:+g.price||0,cost:+g.cost||0,min:+g.min||0,lead:+g.lead||2,pack:Math.max(1,+g.pack||1),gst:Math.max(0,+g.gst||0),supplier:g.supplier.trim(),phone:g.phone.trim()};if(n){const id=uid();S.products.push({id,...o});ev("OPEN",id,sq)}else{Object.assign(p,o);if(sq!==p.stock)ev("COUNT",p.id,sq,"EDIT")}
      if(o.supplier&&o.phone)S.products.forEach((x)=>{if(x.supplier===o.supplier&&!x.phone)x.phone=o.phone});save();d.close();render()}});
}
function recvForm(id){const p=prod(id);dlg(`<form id="rf"><h2>${t("receive")}: ${esc(p.name)}</h2><label>${t("qty")} (${esc(p.unit)})</label><input name="q" type="number" min="1" step="any" required autofocus><div class="acts"><button type="button" class="btn" data-x>${t("cancel")}</button><button class="btn p">${t("save")}</button></div></form>`,(d)=>{d.querySelector("#rf").onsubmit=(e)=>{e.preventDefault();const q=+new FormData(e.target).get("q")||0;if(q>0){track("receipt");ev("RECEIPT",p.id,q,"DELIVERY")}d.close();render()}})}
function loadSample(){const A="Gupta Traders",B="Patna Wholesale";[["Aashirvaad Atta 5kg","pack",250,290,10,A,5,3,2],["Fortune Oil 1L","pack",125,145,14,A,6,3,6],["Tata Salt 1kg","pack",22,28,30,B,10,2,10],["Maggi 70g","pc",12,14,40,B,20,2,12],["Parle-G","pack",4.5,5,60,B,30,2,24],["Surf Excel 1kg","pack",110,130,8,A,4,3,4],["Tata Tea 250g","pack",95,110,12,B,5,3,6],["Sugar (loose)","kg",40,46,25,A,10,2,5]].forEach(([name,unit,cost,price,stock,supplier,min,lead,pack])=>{const id=uid();S.products.push({id,name,unit,cost,price,supplier,phone:"",min,lead,pack});ev("OPEN",id,stock)});render()}
$("#setbtn").onclick=()=>dlg(`<h2>${t("settings")}</h2><label>${t("shop")}</label><input id="sn" value="${esc(S.shop)}"><label>${t("addr")}</label><input id="sa" value="${esc(S.addr||"")}"><label>${t("gstin")}</label><input id="sg" value="${esc(S.gstin||"")}"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sgo" style="width:auto" ${S.gstOn?"checked":""}> ${t("gston")}</label><label>${t("lang")}</label><select id="sl"><option value="en">English</option><option value="hi">हिन्दी</option></select><p class="sm mut" style="margin-top:14px">${t("tip")}</p><div class="acts" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn" id="bk">${t("backup")}</button><button class="btn" id="rs">${t("restore")}</button><button class="btn" id="mg">${t("merge")}</button><button class="btn" id="fb">${t("fb")}</button><button class="btn" id="tr">${t("report")}</button></div><div class="acts"><button class="btn" data-x>${t("cancel")}</button><button class="btn p" id="ss">${t("save")}</button></div><input type="file" id="fl" accept=".json" hidden><input type="file" id="fm" accept=".json" hidden>`,(d)=>{
  d.querySelector("#sl").value=S.lang;
  d.querySelector("#ss").onclick=()=>{S.shop=d.querySelector("#sn").value.trim()||"My Kirana";S.lang=d.querySelector("#sl").value;S.addr=d.querySelector("#sa").value.trim();S.gstin=d.querySelector("#sg").value.trim();S.gstOn=d.querySelector("#sgo").checked;save();d.close();render()};
  d.querySelector("#bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download=`dukaansaathi-backup-${new Date().toISOString().slice(0,10)}.json`;a.click()};
  d.querySelector("#rs").onclick=()=>d.querySelector("#fl").click();
  d.querySelector("#fb").onclick=()=>{const n=prompt(t("fbp"));if(n){S.notes=S.notes||[];S.notes.push({t:Date.now(),n});save();toast("✓")}};
  d.querySelector("#tr").onclick=()=>{const c={};for(const e of EV)c[e.type]=(c[e.type]||0)+1;const r={shop:S.shop,generated:new Date().toISOString(),daysUsed:Object.keys(S.days||{}).length,actions:S.use||{},ledger:c,items:S.products.length,customers:S.customers.length,itemsNeedingCount:S.products.filter((p)=>evState(p)==="stale").length,notes:S.notes||[],orders:S.ordlog||[],overrideRate:(()=>{const a=(S.ordlog||[]).flatMap((o)=>o.items);return a.length?+(a.filter((i)=>i.sent!==i.sug).length/a.length).toFixed(2):null})()};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:"application/json"}));a.download="dukaansaathi-trial-report.json";a.click()};
  d.querySelector("#mg").onclick=()=>d.querySelector("#fm").click();
  d.querySelector("#fm").onchange=async(e)=>{try{const n=await mergeBackup(JSON.parse(await e.target.files[0].text()));d.close();render();toast(`${n} ${t("merged")}`)}catch{toast(t("bad"))}};
  d.querySelector("#fl").onchange=async(e)=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.products))throw 0;S=Object.assign(fresh(),j);migrate();derive();d.close();render()}catch{toast("Invalid backup file")}}});
migrate();derive();navigator.storage?.persist?.();render();
</script></body></html>
